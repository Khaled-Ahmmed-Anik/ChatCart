services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - rails_storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  rails_storage:
  caddy_data:
  caddy_config:
