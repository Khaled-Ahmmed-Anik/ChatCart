type Analytics {
  averageOrderValue: String!
  confirmedOrders: Int!
  conversationToOrderRate: Float!
  conversations: Int!
  orderingCustomers: Int!
  ordersByChannel: JSON!
  ordersByStatus: JSON!
  repeatCustomerRate: Float!
  repeatCustomers: Int!
  revenue: String!
  topProducts: JSON!
  uniqueCustomers: Int!
}

type Business {
  category: String
  currency: String!
  defaultLanguage: String!
  id: ID!
  name: String!
  settings: JSON!
  slug: String!
  status: String!
  timezone: String!
}

"""
Represents untyped JSON
"""
scalar JSON

type Mutation {
  saveProduct(id: ID, input: ProductInput!): SaveProductPayload
}

type Product {
  active: Boolean!
  benefits: String
  category: String
  description: String
  id: ID!
  name: String!
  price: String!
  productAttributes: JSON!
  shortDescription: String
  stockQuantity: Int!
  suitableFor: String
  tags: String
  usageInstructions: String
  variants: [ProductVariant!]!
  wooCommerceProductId: String
}

input ProductInput {
  active: Boolean = true
  benefits: String
  category: String
  description: String
  name: String!
  price: String!
  productAttributes: JSON
  shortDescription: String
  stockQuantity: Int!
  suitableFor: String
  tags: String
  usageInstructions: String
  variants: [ProductVariantInput!]
  wooCommerceProductId: String
}

type ProductVariant {
  active: Boolean!
  id: ID!
  name: String!
  position: Int!
  price: String!
  size: String
  sku: String
  stockQuantity: Int!
}

input ProductVariantInput {
  active: Boolean = true
  id: ID
  name: String!
  position: Int = 0
  price: String!
  size: String
  sku: String
  stockQuantity: Int!
}

type Query {
  analytics: Analytics!
  currentBusiness: Business!
  products(first: Int = 50): [Product!]!
  viewer: User!
}

"""
Autogenerated return type of SaveProduct.
"""
type SaveProductPayload {
  errors: [String!]!
  product: Product
}

type User {
  email: String!
  id: ID!
  name: String!
  role: String!
}
