en:
  conversation_repair:
    en:
      handover: "Please wait, we will get back to you soon."
      question_product: "Which product are you asking about? Send its name, or tell me what you need and your budget."
      retry_product: "Are you choosing a new product or asking about something you already ordered? Your current selection is unchanged."
      question_delivery: "Is your question about delivery cost, delivery time, or a parcel you already ordered?"
      retry_delivery: "Do you need a delivery estimate or help with an existing parcel? Tell me the delivery area or order reference—whichever applies."
      question_payment: "Are you asking how to pay, or is there a problem with a payment you made?"
      retry_payment: "Was the payment already made? Tell me which payment method you used; please don’t send card details or passwords."
      question_order: "Would you like to view your order, change it, or ask about a return?"
      retry_order: "What should change or be checked on the order? Your order is unchanged while we clarify."
      support: "Sorry you’re having trouble. I can help with products and orders here, but I can’t fix website or account-access problems. Please describe the issue so the seller can help. Your order hasn’t been changed."
      discovery: "Know what you want? Send the product name. Not sure? Tell me what you’ll use it for, any preferences, and your budget."
    banglish:
      handover: "Ektu opekkha korun, amra shighroi apnar sathe jogajog korbo."
      question_product: "Kon product niye jante chan? Nam-ta bolun, ba ki lagbe ar budget-ta bolben?"
      retry_product: "Notun product nite chan, naki ager order niye jante chan? Apnar selection change hoyni."
      question_delivery: "Delivery charge, koto din lagbe, naki ager parcel niye jante chan?"
      retry_delivery: "Delivery estimate lagbe, naki ager parcel-er help? Proyojon onujayi area ba order reference-ta bolben?"
      question_payment: "Kibhabe pay korben jante chan, naki payment kore kono problem hoyeche?"
      retry_payment: "Payment ki hoye geche? Kon method use korechen bolben? Card details ba password diben na."
      question_order: "Order dekhben, change korben, naki return niye jante chan?"
      retry_order: "Order-er kon bishoy-ta change ba check korte chan? Ekhono order change hoyni."
      support: "Apnar oshubidhar jonno dukkhoito. Ekhane product ar order niye help korte pari, kintu website ba account-er problem fix korte pari na. Problem-ta ektu bolben, jate seller help korte paren? Apnar order change hoyni."
      discovery: "Product pochondo kora thakle nam-ta bolun. Na hole ki kajer jonno lagbe, kono preference ache kina, ar budget-ta bolben?"
    bn:
      handover: "অনুগ্রহ করে একটু অপেক্ষা করুন, আমরা শিগগিরই আপনার সাথে যোগাযোগ করব।"
      support: "আপনার অসুবিধার জন্য দুঃখিত। এখানে পণ্য ও অর্ডার নিয়ে সাহায্য করতে পারি, কিন্তু ওয়েবসাইট বা অ্যাকাউন্টের সমস্যা ঠিক করতে পারি না। সমস্যাটি বলবেন, যাতে বিক্রেতা সাহায্য করতে পারেন? আপনার অর্ডার বদলানো হয়নি।"
      discovery: "পণ্য পছন্দ করা থাকলে নাম বলুন। না হলে কী কাজে লাগবে, আপনার পছন্দ এবং বাজেট বলবেন?"
      question_product: "কোন পণ্য নিয়ে জানতে চান? নাম বলুন, অথবা কী দরকার ও বাজেট বলবেন?"
      retry_product: "নতুন পণ্য নিতে চান, নাকি আগের অর্ডার নিয়ে জানতে চান? আপনার পছন্দ বদলানো হয়নি।"
      question_delivery: "ডেলিভারি খরচ, সময়, নাকি আগের পার্সেল নিয়ে জানতে চান?"
      retry_delivery: "ডেলিভারির আনুমানিক সময় জানতে চান, নাকি আগের পার্সেলে সাহায্য দরকার? এলাকা বা অর্ডারের নম্বর বলবেন?"
      question_payment: "কীভাবে টাকা দেবেন জানতে চান, নাকি টাকা দেওয়ার পরে সমস্যা হয়েছে?"
      retry_payment: "টাকা কি দেওয়া হয়েছে? কোন পদ্ধতিতে দিয়েছেন বলবেন? কার্ডের তথ্য বা পাসওয়ার্ড পাঠাবেন না।"
      question_order: "অর্ডার দেখবেন, বদলাবেন, নাকি ফেরত নিয়ে জানতে চান?"
      retry_order: "অর্ডারের কোন বিষয় বদলাতে বা দেখতে চান? এখনও অর্ডার বদলানো হয়নি।"
