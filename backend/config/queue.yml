default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: <%= ENV.fetch("JOB_THREADS", 2) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  dispatchers:
    - polling_interval: <%= ENV.fetch("JOB_DISPATCH_INTERVAL", 1) %>
      batch_size: 100
  workers:
    - queues: "*"
      threads: <%= ENV.fetch("JOB_THREADS", 2) %>
      processes: 1
      polling_interval: <%= ENV.fetch("JOB_POLLING_INTERVAL", 1) %>
