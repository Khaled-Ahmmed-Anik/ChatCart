query DashboardContext {
  viewer {
    id
    name
    email
    role
  }
  currentBusiness {
    id
    name
    slug
    category
    defaultLanguage
    timezone
    currency
    status
  }
}

query DashboardAnalytics {
  analytics {
    conversations
    uniqueCustomers
    confirmedOrders
    conversationToOrderRate
    orderingCustomers
    repeatCustomers
    repeatCustomerRate
    revenue
    averageOrderValue
    ordersByChannel
    ordersByStatus
    topProducts
  }
}

query DashboardProducts($first: Int = 50) {
  products(first: $first) {
    id
    name
    description
    shortDescription
    category
    benefits
    usageInstructions
    suitableFor
    productAttributes
    price
    stockQuantity
    tags
    active
    wooCommerceProductId
    variants {
      id
      name
      size
      sku
      price
      stockQuantity
      active
      position
    }
  }
}

mutation SaveDashboardProduct($id: ID, $input: ProductInput!) {
  saveProduct(id: $id, input: $input) {
    product {
      id
      name
      description
      shortDescription
      category
      benefits
      usageInstructions
      suitableFor
      productAttributes
      price
      stockQuantity
      tags
      active
      wooCommerceProductId
      variants {
        id
        name
        size
        sku
        price
        stockQuantity
        active
        position
      }
    }
    errors
  }
}
